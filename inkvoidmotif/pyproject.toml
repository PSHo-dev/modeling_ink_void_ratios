[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inkvoidmotif"
version = "0.1.0"
description = "API pipeline for extracting and recomposing Chinese painting motif banks."
readme = "README.md"
license = "LicenseRef-Anonymous-Peer-Review"
license-files = ["REVIEW_LICENSE.md"]
requires-python = ">=3.10"
keywords = ["chinese-painting", "gradio", "image-generation", "motif", "void-ratio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: Gradio",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "openai>=2.38,<3",
  "pillow>=12.3.0,<13",
  "python-dotenv>=1.0.0",
  "numpy>=2,<3",
  "gradio>=6.26,<6.27",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.9,<2",
  "build>=1.4,<2",
  "coverage>=7.13,<8",
  "mypy>=1.19,<2",
  "pip-audit>=2.10,<3",
  "ruff>=0.15,<0.16",
]

[project.scripts]
inkvoidmotif = "inkvoidmotif.cli:main"
inkvoidmotif-studio = "inkvoidmotif.gradio_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "BLE", "C4", "E4", "E7", "E9", "F", "I", "RUF", "S", "SIM", "UP"]
ignore = ["RUF001", "RUF002"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
